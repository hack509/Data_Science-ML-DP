[pytest]
# The repository root is added to sys.path so that `import lab` works everywhere.
pythonpath = .
testpaths = tests
markers =
    slow: tests that train neural networks or run many lesson snippets (deselect with -m "not slow")
    torch: tests that require PyTorch
addopts = -ra --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning:jupyter_client.*
